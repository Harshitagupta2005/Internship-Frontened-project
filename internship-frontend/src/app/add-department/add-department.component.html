<div class="page-layout">
  <app-sidebar></app-sidebar>

  <div class="form-page">

    <div class="page-header">
      <h1>➕ Add New Department</h1>
      <p>Employee Helpdesk — Create a new department</p>
    </div>

    <app-notification
      [type]="notifType"
      [message]="notifMessage"
      [show]="showNotification">
    </app-notification>

    <div class="form-card">
      <form [formGroup]="departmentForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label>Department Name <span class="required">*</span></label>
          <input
            type="text"
            formControlName="name"
            placeholder="Enter department name"
            [class.error-input]="submitted && f['name'].errors" />

          <div class="error-msg" *ngIf="submitted && f['name'].errors">
            <span *ngIf="f['name'].errors['required']">⚠ Department name is required</span>
            <span *ngIf="f['name'].errors['minlength']">⚠ Name must be at least 2 characters</span>
            <span *ngIf="f['name'].errors['backend']">⚠ {{ f['name'].errors['backend'] }}</span>
          </div>
        </div>

        <div class="form-btns">
          <button type="submit" class="btn-submit" [disabled]="isSubmitting">
            {{ isSubmitting ? '⏳ Saving...' : '💾 Add Department' }}
          </button>
          <button type="button" class="btn-cancel" (click)="onCancel()" [disabled]="isSubmitting">✖ Cancel</button>
        </div>

      </form>
    </div>

  </div>
</div>
