<div class="login-page">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo">🌿</div>
      <h1>InternshipApp</h1>
      <p>Employee Helpdesk System</p>
    </div>

    <div class="error-box" *ngIf="errorMessage">
      <span>❌ {{ errorMessage }}</span>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label>Email Address <span class="required">*</span></label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          [class.error-input]="submitted && f['email'].invalid" />

        <div class="error-msg" *ngIf="submitted && f['email'].errors">

          <span *ngIf="f['email'].errors?.['required']">
            ⚠ Email is required
          </span>

          <span *ngIf="f['email'].errors?.['email']">
            ⚠ Please enter a valid email
          </span>

        </div>
      </div>

      <div class="form-group">
        <label>Password <span class="required">*</span></label>

        <div class="password-wrapper">
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            [class.error-input]="submitted && f['password'].invalid" />

          <button
            type="button"
            class="toggle-btn"
            (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </button>
        </div>

        <div class="error-msg" *ngIf="submitted && f['password'].errors">

          <span *ngIf="f['password'].errors?.['required']">
            ⚠ Password is required
          </span>

          <span *ngIf="f['password'].errors?.['minlength']">
            ⚠ Min 6 characters required
          </span>

        </div>
      </div>

      <button
        type="submit"
        class="login-btn"
        [disabled]="isLoading">

        {{ isLoading ? '⏳ Logging in...' : '🔐 Login' }}

      </button>

    </form>

    <div class="login-footer">
      <p>Default credentials:</p>
      <p>📧 admin&#64;helpdesk.com | 🔑 Admin&#64;1234</p>
    </div>

  </div>
</div>
