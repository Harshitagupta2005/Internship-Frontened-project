<app-notification
[type]="notifType"
[message]="notifMessage"
[show]="showNotification">
</app-notification>


<div class="form-card">


<h2>➕ Add New User</h2>

<p>
Employee Helpdesk — Create a new system user
</p>



<form [formGroup]="userForm" (ngSubmit)="onSubmit()">



<div class="form-group">

<label>Name *</label>

<input
type="text"
formControlName="name"
placeholder="Enter full name"
/>


<div class="error-msg" *ngIf="submitted && f['name'].errors">

<span *ngIf="f['name'].errors?.['required']">
⚠ Name is required
</span>


<span *ngIf="f['name'].errors?.['minlength']">
⚠ Minimum 3 characters required
</span>


</div>


</div>





<div class="form-group">


<label>Email *</label>


<input
type="email"
formControlName="email"
placeholder="Enter email"
/>



<div class="error-msg" *ngIf="submitted && f['email'].errors">


<span *ngIf="f['email'].errors?.['required']">
⚠ Email required
</span>


<span *ngIf="f['email'].errors?.['email']">
⚠ Invalid email
</span>


</div>



</div>






<div class="form-group">


<label>Password *</label>


<input
type="password"
formControlName="password"
placeholder="Enter password"
/>



<div class="error-msg" *ngIf="submitted && f['password'].errors">


<span *ngIf="f['password'].errors?.['required']">
⚠ Password required
</span>


<span *ngIf="f['password'].errors?.['minlength']">
⚠ Minimum 8 characters required
</span>


</div>



</div>






<div class="form-group">


<label>Role *</label>


<select formControlName="role">


<option value="">
Select Role
</option>


<option 
*ngFor="let role of roleOptions"
[value]="role">

{{role}}

</option>


</select>



<div class="error-msg" *ngIf="submitted && f['role'].errors">

⚠ Role required

</div>



</div>






<div class="form-actions">


<button 
type="button"
class="cancel-btn"
(click)="onCancel()">

Cancel

</button>



<button
type="submit"
class="submit-btn"
[disabled]="isSubmitting">


{{isSubmitting ? 'Saving...' : 'Save User'}}


</button>



</div>



</form>


</div>
