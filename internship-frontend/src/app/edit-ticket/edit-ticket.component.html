<div class="page-layout">
  <app-sidebar></app-sidebar>
  <div class="form-page">

    <div class="page-header">
      <h1>✏️ Edit Ticket</h1>
      <p>Update ticket details — {{ ticketId }}</p>
    </div>
    <app-notification
  [type]="notifType"
  [message]="notifMessage"
  [show]="showNotification">
</app-notification>

    <div class="form-card">
      <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()">

        <!-- Title -->
        <div class="form-group">
          <label>Title <span class="required">*</span></label>
          <input type="text" formControlName="title" placeholder="Enter ticket title" [class.error-input]="submitted && f['title'].errors" />
          <div class="error-msg" *ngIf="submitted && f['title'].errors">
            <span *ngIf="f['title'].errors['required']">⚠ Title is required</span>
            <span *ngIf="f['title'].errors['minlength']">⚠ Title must be at least 5 characters</span>
          </div>
        </div>

        <!-- Description -->
        <div class="form-group">
          <label>Description <span class="required">*</span></label>
          <textarea formControlName="description" placeholder="Describe the issue..." rows="4" [class.error-input]="submitted && f['description'].errors"></textarea>
          <div class="error-msg" *ngIf="submitted && f['description'].errors">
            <span *ngIf="f['description'].errors['required']">⚠ Description is required</span>
            <span *ngIf="f['description'].errors['minlength']">⚠ Description must be at least 10 characters</span>
          </div>
        </div>

        <!-- Status & Priority -->
        <div class="form-row">
          <div class="form-group">
            <label>Status <span class="required">*</span></label>
            <select formControlName="status" [class.error-input]="submitted && f['status'].errors">
              <option value="">-- Select Status --</option>
              <option *ngFor="let s of statusOptions" [value]="s">{{ s }}</option>
            </select>
            <div class="error-msg" *ngIf="submitted && f['status'].errors">
              <span>⚠ Status is required</span>
            </div>
          </div>

          <div class="form-group">
            <label>Priority <span class="required">*</span></label>
            <select formControlName="priority" [class.error-input]="submitted && f['priority'].errors">
              <option value="">-- Select Priority --</option>
              <option *ngFor="let p of priorityOptions" [value]="p">{{ p }}</option>
            </select>
            <div class="error-msg" *ngIf="submitted && f['priority'].errors">
              <span>⚠ Priority is required</span>
            </div>
          </div>
        </div>

        <!-- Assigned To -->
        <div class="form-group">
          <label>Assigned To <span class="required">*</span></label>
          <select formControlName="assignedTo" [class.error-input]="submitted && f['assignedTo'].errors">
            <option value="">-- Select Assignee --</option>
            <option *ngFor="let a of assigneeOptions" [value]="a">{{ a }}</option>
          </select>
          <div class="error-msg" *ngIf="submitted && f['assignedTo'].errors">
            <span>⚠ Please assign the ticket</span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="form-btns">
          <button type="submit" class="btn-submit">💾 Update Ticket</button>
          <button type="button" class="btn-cancel" (click)="onCancel()">✖ Cancel</button>
        </div>

      </form>
    </div>
  </div>
</div>
