<div class="sidebar-wrapper">

  <!-- Mobile Toggle Button -->
  <button class="sidebar-toggle" (click)="toggleSidebar()">
    ☰ Menu
  </button>

  <!-- Sidebar -->
  <div class="sidebar" [class.open]="isOpen">
    <div class="sidebar-header">
      <span>🌿 InternshipApp</span>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link" (click)="isOpen=false">
        <span class="icon">📊</span> Dashboard
      </a>
      <a routerLink="/profile" routerLinkActive="active" class="sidebar-link" (click)="isOpen=false">
        <span class="icon">👤</span> Profile
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="sidebar-link" (click)="isOpen=false">
        <span class="icon">📬</span> Contact
      </a>
    </nav>

    <div class="sidebar-footer">
      <p>Harshita Gupta</p>
      <span>Frontend Intern</span>
    </div>
  </div>

  <!-- Overlay for mobile -->
  <div class="overlay" [class.show]="isOpen" (click)="isOpen=false"></div>

</div>
