    <nav class="sidebar-nav">
  <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link" (click)="isOpen=false"><span class="icon">📊</span> Dashboard</a>

  <a routerLink="/users" routerLinkActive="active" class="sidebar-link" (click)="isOpen=false"><span class="icon">👥</span> Users</a>
</nav>
    <div class="sidebar-footer">
      <p>Harshita Gupta</p>
