<div class="contact-page">
  <div class="page-header">
    <h1>📬 Contact</h1>
    <p>Get in touch with me</p>
  </div>
  <div class="contact-grid">
    <div class="contact-info">
      <h3>Contact Information</h3>
      <div class="info-item"><span>📧</span><div><strong>Email</strong><p>hg4579655&#64;gmail.com</p></div></div>
      <div class="info-item"><span>📍</span><div><strong>Location</strong><p>India</p></div></div>
      <div class="info-item"><span>💼</span><div><strong>Role</strong><p>Frontend Intern</p></div></div>
    </div>
    <div class="contact-form-card">
      <div *ngIf="!submitted">
        <h3>Send a Message</h3>
        <div class="form-group">
          <label>Your Name</label>
          <input type="text" [(ngModel)]="name" placeholder="Enter your name" />
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" [(ngModel)]="email" placeholder="Enter your email" />
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea [(ngModel)]="message" placeholder="Type your message..." rows="5"></textarea>
        </div>
        <button class="submit-btn" (click)="onSubmit()">Send Message 🚀</button>
      </div>
      <div *ngIf="submitted" class="success-msg">
        <div class="success-icon">✅</div>
        <h3>Message Sent!</h3>
        <p>Thanks <strong>{{ name }}</strong>, your message has been received.</p>
        <button class="reset-btn" (click)="reset()">Send Another</button>
      </div>
    </div>
  </div>
</div>
