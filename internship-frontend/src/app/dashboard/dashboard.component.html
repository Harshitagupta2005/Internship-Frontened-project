<div class="page-layout">
  <app-sidebar></app-sidebar>
  <div class="dashboard">
    <div class="page-header">
      <h1>📊 Dashboard</h1>
      <p>Welcome back, Harshita!</p>
    </div>

    <!-- Stats Cards -->
    <div class="cards-grid">
      <div class="dash-card" *ngFor="let card of cards" [style.borderTopColor]="card.color">
        <div class="card-icon">{{ card.icon }}</div>
        <div class="card-value" [class.loading-val]="isLoading">{{ card.value }}</div>
        <div class="card-label">{{ card.label }}</div>
      </div>
    </div>

    <!-- User Profile Card -->
    <div class="section-title">👤 User Profile</div>
    <div class="profile-card">
      <div class="profile-avatar">H</div>
      <div class="profile-info">
        <h2>Harshita Gupta</h2>
        <div class="info-row"><span class="info-label">📧 Email</span><span>hg4579655&#64;gmail.com</span></div>
        <div class="info-row"><span class="info-label">🏢 Department</span><span>Computer Science</span></div>
        <div class="info-row"><span class="info-label">💼 Designation</span><span>Frontend Intern</span></div>
      </div>
    </div>
  </div>
</div>
